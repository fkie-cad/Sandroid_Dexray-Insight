# GitHub secret-scanning configuration.
# https://docs.github.com/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/excluding-folders-and-files-from-secret-scanning
#
# Dexray Insight is a secret-DETECTION tool, so its tests and reference data
# intentionally contain synthetic (non-live) sample credentials that exercise
# the detection engine. The paths below are excluded from secret-scanning ALERTS
# to keep the alert list focused on genuine findings.
#
# IMPORTANT: `paths-ignore` applies to secret-scanning *alerts* only. It does NOT
# disable Push Protection, which scans every pushed commit against GitHub's
# partner patterns regardless of this file. A push that trips Push Protection on
# one of these synthetic fixtures is resolved with the one-time "unblock-secret"
# URL GitHub prints (reason: "used in tests"). See docs/contributing.rst,
# section "Secret Detection and GitHub Push Protection".
paths-ignore:
  - "src/dexray_insight/security/data/known_safe_credentials.yaml"
  - "tests/unit/security/**"

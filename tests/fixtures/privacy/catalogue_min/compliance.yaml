rules:
  base: [MASWE-0073, GDPR-13, BSI-O.Purp_1]
  code_or_sdk_evidence: [MASTG-TEST-0318]
  read_call_site: [TDDDG-25]
  sensitive_read_call_site: {categories: [location, contacts, calendar, email_text_message, health_fitness], refs: [BSI-O.Purp_2]}
  data_type: {identifiers.other: [MASWE-0068, GDPR-4(1), TDDDG-25], health_fitness.*: [GDPR-9]}
  finding:
    no_consent_mechanism: [MASWE-0078, GDPR-6(1)(a), GDPR-7, TDDDG-25, BSI-O.Purp_3]
    sdk_identifier_access_without_consent: [TDDDG-25, MASWE-0078, BSI-O.Purp_4]
    non_resettable_identifier: [MASWE-0068, GDPR-4(1)]
    sdk_collection_default_on: [MASWE-0071, GDPR-25, BSI-O.Purp_7]
    sdk_sink_with_app_data: [MASTG-TEST-0318, BSI-O.Purp_8]
    permission_without_call_site: [MASWE-0066, MASTG-TEST-0254, GDPR-5(1)(c), BSI-O.Plat_2]
    broad_media_access: [MASWE-0069, GDPR-5(1)(c)]

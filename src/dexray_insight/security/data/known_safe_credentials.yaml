# Known credential-class registry for secret-detection triage (PR-5).
#
# Each entry maps a credential *shape* (by literal prefix and/or by the detection
# pattern that produced it) to one of THREE classes. The class decides how the
# SecretValidator may (or may NOT) adjust the severity of a match:
#
#   public_client        -> LOW  "client-side key (safe by design)".
#                           These keys are meant to ship inside the client (the
#                           app already contains them). They may be downranked.
#
#   private_secret       -> CRITICAL / HIGH. Server-side secrets. The allowlist
#                           can NEVER downgrade these; if a pattern already rated
#                           the match higher, the higher severity wins.
#
#   restriction_dependent-> MEDIUM floor, NEVER fully suppressed. Whether the key
#                           is dangerous depends on server-side API restrictions
#                           that cannot be seen from the APK, so the finding always
#                           surfaces and carries a "verify restrictions" note.
#                           Co-location context (see the AIza entry) may set a more
#                           specific severity, but a `prefix_only` basis may NOT
#                           push it below the MEDIUM floor.
#
# Per-entry metadata (class / source_url / date_added / sample) documents WHY a
# shape is classified the way it is; `sample` values are synthetic, never live.
#
# NOTE (secret scanning): `sample` values match real credential shapes on
# purpose, so GitHub Push Protection may block a push that adds new entries.
# That is expected for synthetic samples — resolve it via the one-time
# "unblock-secret" URL GitHub prints (reason: "used in tests"). Keep every
# `sample` marked with a trailing `# pragma: allowlist secret` so the local
# detect-secrets hook ignores it. See docs/contributing.rst ->
# "Secret Detection and GitHub Push Protection".

version: 1

entries:
  # --- Stripe ------------------------------------------------------------------
  - name: stripe_publishable_live
    prefix: "pk_live_"
    class: public_client
    severity: LOW
    label: "client-side key (safe by design)"
    source_url: "https://docs.stripe.com/keys"
    date_added: "2026-07-22"
    sample: "pk_live_0123456789abcdefghijklmn"  # pragma: allowlist secret
  - name: stripe_publishable_test
    prefix: "pk_test_"
    class: public_client
    severity: LOW
    label: "client-side key (safe by design)"
    source_url: "https://docs.stripe.com/keys"
    date_added: "2026-07-22"
    sample: "pk_test_0123456789abcdefghijklmn"  # pragma: allowlist secret
  - name: stripe_secret_live  # PRIVATE TWIN of pk_live_
    prefix: "sk_live_"
    class: private_secret
    severity: CRITICAL
    label: "server-side secret key"
    source_url: "https://docs.stripe.com/keys"
    date_added: "2026-07-22"
    sample: "sk_live_0123456789abcdefghijklmn"  # pragma: allowlist secret
  - name: stripe_secret_test
    prefix: "sk_test_"
    class: private_secret
    severity: HIGH
    label: "server-side secret key (test)"
    source_url: "https://docs.stripe.com/keys"
    date_added: "2026-07-22"
    sample: "sk_test_0123456789abcdefghijklmn"  # pragma: allowlist secret

  # --- Branch.io ---------------------------------------------------------------
  - name: branch_live_key
    prefix: "key_live_"
    class: public_client
    severity: LOW
    label: "client-side key (safe by design)"
    source_url: "https://help.branch.io/using-branch/docs/branch-key-vs-app-id"
    date_added: "2026-07-22"
    sample: "key_live_abcdefghijklmnopqrstuvwxyz012345"  # pragma: allowlist secret
  - name: branch_test_key
    prefix: "key_test_"
    class: public_client
    severity: LOW
    label: "client-side key (safe by design)"
    source_url: "https://help.branch.io/using-branch/docs/branch-key-vs-app-id"
    date_added: "2026-07-22"
    sample: "key_test_abcdefghijklmnopqrstuvwxyz012345"  # pragma: allowlist secret
  - name: branch_live_secret  # PRIVATE TWIN of key_live_
    prefix: "secret_live_"
    class: private_secret
    severity: HIGH
    label: "server-side secret"
    source_url: "https://help.branch.io/using-branch/docs/branch-key-vs-app-id"
    date_added: "2026-07-22"
    sample: "secret_live_abcdefghijklmnopqrstuvwxyz012345"  # pragma: allowlist secret
  - name: branch_test_secret
    prefix: "secret_test_"
    class: private_secret
    severity: HIGH
    label: "server-side secret (test)"
    source_url: "https://help.branch.io/using-branch/docs/branch-key-vs-app-id"
    date_added: "2026-07-22"
    sample: "secret_test_abcdefghijklmnopqrstuvwxyz012345"  # pragma: allowlist secret

  # --- Google AdMob ------------------------------------------------------------
  - name: admob_app_id
    prefix: "ca-app-pub-"
    class: public_client
    severity: LOW
    label: "client-side key (safe by design)"
    source_url: "https://support.google.com/admob/answer/7356431"
    date_added: "2026-07-22"
    sample: "ca-app-pub-1234567890123456~1234567890"

  # --- Crashlytics / Fabric ----------------------------------------------------
  # Prefix-less: matched by the crashlytics_api_key detection pattern name.
  - name: crashlytics_api_key
    pattern_name: crashlytics_api_key
    class: public_client
    severity: LOW
    label: "client-side key (safe by design)"
    source_url: "https://firebase.google.com/docs/crashlytics"
    date_added: "2026-07-22"
    sample: "0123456789abcdef0123456789abcdef01234567"  # pragma: allowlist secret

  # --- Google AIza API keys ----------------------------------------------------
  # The AIza prefix does NOT encode public-vs-private; danger depends entirely on
  # server-side key restrictions. Classified restriction_dependent so the finding
  # is never fully suppressed. Severity is refined by co-location context in the
  # validator (Firebase config fields -> LOW; maps/geo meta-data -> LOW/MEDIUM;
  # bare -> MEDIUM floor).
  - name: google_api_key_aiza
    prefix: "AIza"
    pattern_name: google_api_key_aiza
    class: restriction_dependent
    severity: MEDIUM
    label: "API key (verify restrictions)"
    note: "verify server-side API key restrictions"
    source_url: "https://cloud.google.com/docs/authentication/api-keys"
    date_added: "2026-07-22"
    sample: "AIzaSyCavBhXuLCGdOzaOpKn2rzP8rHxWAd3MCA"  # pragma: allowlist secret

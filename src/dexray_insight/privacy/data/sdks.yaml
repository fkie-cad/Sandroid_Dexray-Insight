# App namespaces (attribution): the manifest package, plus its first-two-segment root unless
# that root is shared by unrelated publishers, plus the Application class's package unless it
# is a framework or SDK package. Own curation (package naming conventions), no external data.
app_namespace:
  shared_roots: [com.google, com.github, io.github, com.gitlab, io.gitlab, com.facebook, org.apache, androidx, android,
    kotlin, kotlinx, org.jetbrains, com.android, io.flutter, com.squareup, org.json, com.amazon, com.microsoft, com.huawei,
    com.samsung, com.example, io.reactivex, org.chromium]
  framework_prefixes: [android., android.support., androidx., com.google.android., com.google.firebase., io.flutter.,
    com.facebook.react., com.reactnativenavigation., org.apache.cordova., com.getcapacitor., com.unity3d., mono.android.,
    microsoft.maui., org.acra., com.orm., kotlin.]
manifest_flags:
- key: firebase_analytics_collection_enabled
  sdk_id: firebase_analytics
  type: bool
  off_when: ['false']
  default_when_absent: 'on'
  effect: collection_suspended_until_enabled
  data_types: ['*']
  items: null
  sources: [firebase-configure-data-collection, firebase-ref-analytics]
  read_by: 'All Google Analytics for Firebase generations (play-services-measurement).'
  note: Can be switched on at runtime with setAnalyticsCollectionEnabled(true).
- key: firebase_analytics_collection_deactivated
  sdk_id: firebase_analytics
  type: bool
  off_when: ['true']
  default_when_absent: 'on'
  effect: collection_off_permanently
  data_types: ['*']
  items: null
  sources: [firebase-configure-data-collection]
  read_by: 'All Google Analytics for Firebase generations (play-services-measurement).'
- key: google_analytics_adid_collection_enabled
  sdk_id: firebase_analytics
  type: bool
  off_when: ['false']
  default_when_absent: 'on'
  effect: adid_collection_off
  data_types: [identifiers.other]
  items: [advertising_id]
  sources: [firebase-configure-data-collection]
  read_by: 'Google Analytics for Firebase with AD_ID support (play-services-measurement 17+).'
  note: Default when absent is not stated on the page; collection is the default.
- key: google_analytics_default_allow_analytics_storage
  sdk_id: firebase_analytics
  type: bool
  off_when: ['false']
  default_when_absent: null
  effect: storage_denied_by_default
  data_types: [identifiers.other]
  items: [app_instance_id]
  sources: [google-consent-mode-app]
  read_by: 'Consent-mode SDKs only (play-services-measurement 21+, 2023); absent from older bundles such as VOI 2.24.2 and Spin 2.21.0.'
  note: Consent mode default; no value is set by default.
- key: google_analytics_default_allow_ad_storage
  sdk_id: firebase_analytics
  type: bool
  off_when: ['false']
  default_when_absent: null
  effect: storage_denied_by_default
  data_types: [identifiers.other]

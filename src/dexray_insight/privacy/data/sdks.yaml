- id: firebase_analytics
  name: Google Analytics for Firebase
  role: analytics
  tracker_db_ids: [google_firebase_analytics]
  prefixes:
  - {prefix: com.google.firebase.analytics., source: vendor-firebase-analytics-ref}
  - {prefix: com.google.android.gms.measurement., source: vendor-gms-measurement-ref}
  exclude_prefixes: []
  obfuscated_prefixes: []
  anchors:
  - {kind: class_anchor, value: com.google.firebase.analytics.FirebaseAnalytics, source: vendor-firebase-analytics-ref}
  - {kind: manifest_component, value: com.google.android.gms.measurement.AppMeasurementService, source: vendor-gms-measurement-ref}
  - {kind: manifest_component, value: com.google.android.gms.measurement.AppMeasurementReceiver, source: vendor-gms-measurement-ref}
  - {kind: manifest_meta_data, value: 'com.google.firebase.components:com.google.firebase.analytics.connector.internal.AnalyticsConnectorRegistrar', source: observed-voi-firebase_analytics}
  string_anchors:
  - {value: firebase_analytics_collection_enabled, source: vendor-gmaven-measurement-impl}
  - {value: firebase_analytics_collection_deactivated, source: vendor-gmaven-measurement-impl}
  - {value: google_analytics_adid_collection_enabled, source: vendor-gmaven-measurement-impl}
  - {value: google_analytics_default_allow_ad_personalization_signals, source: vendor-gmaven-measurement-impl}
  - {value: google_analytics_automatic_screen_reporting_enabled, source: vendor-gmaven-measurement-impl}
  source_files: []
  hosts:
  - {host: app-measurement.com, source: vendor-gmaven-measurement-impl}
  collects:
  - {data_type: identifiers.other, item: app_instance_id, mode: auto, requires_permission: null, source: google-analytics-data-disclosure}
  - {data_type: identifiers.other, item: advertising_id, mode: auto, requires_permission: com.google.android.gms.permission.AD_ID, source: google-analytics-data-disclosure}
  - {data_type: location.approx_location, item: masked_ip_address, mode: auto, requires_permission: null, source: google-analytics-data-disclosure, note: Coarse location derived from the masked IP address.}
  - {data_type: financial.purchase_history, item: in_app_purchases, mode: auto, requires_permission: null, requires: {permissions_any: [com.android.vending.BILLING], class_prefixes_any: [com.android.billingclient.]}, source: google-analytics-data-disclosure,
    requires: {permissions_any: [com.android.vending.BILLING], class_prefixes_any: [com.android.billingclient.]}, note: Automatic only for Google Play in-app purchases.}
  - {data_type: actions_in_app.user_interaction, item: app_lifecycle_events, mode: auto, requires_permission: null, source: google-analytics-data-disclosure, note: Screen views and sessions.}
  - {data_type: personal.personal_identifiers, item: user_id, mode: depends_on_usage, requires_permission: null, source: google-analytics-data-disclosure, note: Only when the app sets a user ID.}
  first_party_source: true
  sharing_override: null
  references: {vendor_disclosure: 'https://support.google.com/analytics/answer/11582702', play_sdk_index: null}
  sources: [vendor-firebase-analytics-ref, vendor-gms-measurement-ref, observed-voi-firebase_analytics, google-analytics-data-disclosure, vendor-gmaven-measurement-api, vendor-gmaven-measurement-impl]
